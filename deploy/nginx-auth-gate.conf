# 登录门禁 · nginx 配置样例
# 作用：小游戏页（/game/）与会场页（/venue/）是独立静态页，光靠前端拦截挡不住「直接输网址」，
#       这里在 nginx 层校验 QQ 登录 cookie（后端下发的 HttpOnly cookie，名 cb_user），
#       没登录就把入口页 302 回主站登录页。
#
# 放置位置（宝塔站点扩展配置目录）：
#   /www/server/panel/vhost/nginx/extension/<站点目录名>/auth-gate.conf
# 只拦入口 HTML，不改资源（资源不泄露内容，拦了反而会让已登录用户白屏）。
#
# 回退：删掉这个文件再 `nginx -s reload` 即可恢复「谁都能进」。

location ~ ^/(game|venue)/index\.html$ {
    if ($cookie_cb_user = "") {
        return 302 /#/login;
    }
}
