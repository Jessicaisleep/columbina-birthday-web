# 《新月再梦听羽生》哥伦比娅生日会 · 报名投稿后端
# 放置位置（宝塔站点扩展配置目录）：
#   /www/server/panel/vhost/nginx/extension/47.102.116.172/api.conf
# 作用：把站点的 /api/ 反向代理到本机 Node 后端（127.0.0.1:8788）
#       静态页面仍由 nginx 直接托管，前后端分离。

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8788/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 分片上传：请求体直接透传给后端，不落 nginx 临时文件
    proxy_request_buffering off;

    # 单个分片默认 4MB，留足余量（改大分片时同步调大）
    client_max_body_size 32m;

    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
